{% extends "layout.html" %}
{% block content %}
<div class="max-w-xl mx-auto px-6 py-24">
    <p class="font-mono text-sm text-brand mb-3">404</p>
    <h1 class="font-serif text-4xl text-zinc-100 mb-4">That page doesn't exist</h1>
    <p class="text-zinc-400 leading-relaxed mb-8">Nothing lives at <span class="font-mono text-zinc-200">/{{ request.path.strip('/') }}</span>. It may have moved, or the link might have a typo.</p>
    <p><a href="/" class="btn btn-primary">Back to the home page</a></p>
</div>
{% endblock %}
