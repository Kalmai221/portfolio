{% extends "layout.html" %}
{% block content %}
<div class="max-w-sm mx-auto px-6 py-20">
    <h1 class="font-serif text-3xl text-zinc-100 mb-1">Sign in</h1>
    <p class="text-sm text-zinc-500 mb-8">Admin access for the site owner.</p>

    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="username" class="block text-sm text-zinc-300 mb-1.5">Username</label>
            <input id="username" type="text" name="username" required autocomplete="username"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-md px-3 py-2.5 text-zinc-100 focus:border-brand focus:outline-none">
        </div>
        <div>
            <label for="password" class="block text-sm text-zinc-300 mb-1.5">Password</label>
            <input id="password" type="password" name="password" required autocomplete="current-password"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-md px-3 py-2.5 text-zinc-100 focus:border-brand focus:outline-none">
        </div>
        {% if error %}
        <p role="alert" class="text-sm text-red-400">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>

    <p class="text-sm text-zinc-500 mt-8">
        Just looking? <a href="/trial" class="text-zinc-300 underline underline-offset-4 decoration-zinc-700 hover:decoration-brand">Try the CMS in a sandbox</a> with no account.
    </p>
</div>
{% endblock %}
